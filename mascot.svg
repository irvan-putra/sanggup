<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Sang the gecko: violet body, amber belly and toe pads -->
  <!-- curled tail -->
  <path d="M146 142 q36 2 32 30 q-4 26 -32 22" fill="none" stroke="#6d3fc0" stroke-width="14" stroke-linecap="round"/>
  <!-- back legs -->
  <ellipse cx="50" cy="142" rx="18" ry="9" fill="#5c33a8" transform="rotate(-25 50 142)"/>
  <ellipse cx="150" cy="142" rx="18" ry="9" fill="#5c33a8" transform="rotate(25 150 142)"/>
  <!-- front legs -->
  <ellipse cx="48" cy="104" rx="16" ry="8" fill="#5c33a8" transform="rotate(-30 48 104)"/>
  <ellipse cx="152" cy="104" rx="16" ry="8" fill="#5c33a8" transform="rotate(30 152 104)"/>
  <!-- toe pads -->
  <circle cx="32" cy="98" r="6.5" fill="#f5c96b"/>
  <circle cx="168" cy="98" r="6.5" fill="#f5c96b"/>
  <circle cx="34" cy="152" r="6.5" fill="#f5c96b"/>
  <circle cx="166" cy="152" r="6.5" fill="#f5c96b"/>
  <!-- body -->
  <ellipse cx="100" cy="124" rx="48" ry="38" fill="#6d3fc0"/>
  <!-- belly -->
  <ellipse cx="100" cy="134" rx="30" ry="23" fill="#f5c96b"/>
  <!-- head -->
  <circle cx="100" cy="66" r="40" fill="#6d3fc0"/>
  <!-- eyes -->
  <circle cx="82" cy="58" r="13" fill="#ffffff"/>
  <circle cx="118" cy="58" r="13" fill="#ffffff"/>
  <circle cx="84" cy="60" r="6" fill="#241a33"/>
  <circle cx="120" cy="60" r="6" fill="#241a33"/>
  <circle cx="86" cy="57" r="2" fill="#ffffff"/>
  <circle cx="122" cy="57" r="2" fill="#ffffff"/>
  <!-- smile -->
  <path d="M86 82 q14 12 28 0" fill="none" stroke="#241a33" stroke-width="4" stroke-linecap="round"/>
  <!-- spots -->
  <circle cx="68" cy="112" r="4" fill="#8a5fd0"/>
  <circle cx="132" cy="114" r="4" fill="#8a5fd0"/>
  <circle cx="100" cy="30" r="4" fill="#8a5fd0"/>
</svg>
