name: Android build
on:
  push:
    branches: [main]
    paths: ['android/**', 'app.js', 'data.js', 'index.html', 'styles.css', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Package check
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|application-label:|uses-permission"
          unzip -l "$APK" | grep -E "assets/web/|sang_" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: sanggup-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
