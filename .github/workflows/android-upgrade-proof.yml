name: Sanggup upgrade progress-retention proof

# Scoped synthetic upgrade test: install the actual published OLD test APK,
# seed synthetic learner progress through the real UI (done stages across a
# merged path plus a pending sign-off request), update in place to the actual
# published NEW APK under the same signer, then verify the seeded progress and
# the pending request survive. Artifacts carry screenshots and UI dumps for
# visual inspection. This proves in-place-update retention for the seeded
# shape; it does not exercise every path or a physical phone.

on:
  workflow_dispatch:
    inputs:
      old_tag:
        description: Published tag to upgrade from
        default: v0.1.4
        required: true
      new_tag:
        description: Published tag to upgrade to
        default: v0.2.0
        required: true

permissions:
  contents: read

jobs:
  upgrade-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download both published test APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.old_tag }}" --repo "${{ github.repository }}" --pattern "sanggup-${{ inputs.old_tag }}.apk" --dir dist
          gh release download "${{ inputs.new_tag }}" --repo "${{ github.repository }}" --pattern "sanggup-${{ inputs.new_tag }}.apk" --dir dist
          ls -la dist
      - name: Both APKs carry the same signing certificate
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OLD_CERT=$("$BT/apksigner" verify --print-certs "dist/sanggup-${{ inputs.old_tag }}.apk" | grep -m1 'certificate SHA-256 digest' | awk '{print toupper($NF)}')
          NEW_CERT=$("$BT/apksigner" verify --print-certs "dist/sanggup-${{ inputs.new_tag }}.apk" | grep -m1 'certificate SHA-256 digest' | awk '{print toupper($NF)}')
          echo "old: $OLD_CERT"
          echo "new: $NEW_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seed progress on old APK, update in place, verify retention
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash ci/upgrade-proof.sh "dist/sanggup-${{ inputs.old_tag }}.apk" "dist/sanggup-${{ inputs.new_tag }}.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-evidence
          path: upgrade-evidence/
