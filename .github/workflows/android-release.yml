name: Sanggup signed test release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_CERT: C22B004F08852CDB330BCF3A5D899FA0E1CD14FA2D3D5E1A44D15DC7EFBB7C23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build release
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.SANGGUP_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SANGGUP_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sanggup.jks"
          trap 'rm -f "$RUNNER_TEMP/sanggup.jks"' EXIT
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/sanggup.jks" --ks-key-alias sanggup --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out sanggup-v0.1.1.apk /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs sanggup-v0.1.1.apk | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          test "$GOT" = "$EXPECTED_CERT"
          "$BT/aapt" dump badging sanggup-v0.1.1.apk > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -q "package: name='com.vanipy.sanggup' versionCode='2' versionName='0.1.1'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          ! grep -q 'uses-permission:' /tmp/badging.txt
          sha256sum sanggup-v0.1.1.apk > sanggup-v0.1.1.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Signed APK launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r sanggup-v0.1.1.apk
            adb logcat -c
            adb shell am start -W -n com.vanipy.sanggup/.MainActivity
            sleep 20
            mkdir -p release-evidence
            adb exec-out screencap -p > release-evidence/signed-app.png
            adb logcat -d -b crash > release-evidence/crash.txt
            ! grep -q 'Process: com.vanipy.sanggup' release-evidence/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-evidence
          path: release-evidence/
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 sanggup-v0.1.1.apk sanggup-v0.1.1.apk.sha256 --title 'Sanggup 0.1.1 test' --notes-file android/TEST-RELEASE.md --prerelease --target "$GITHUB_SHA"
