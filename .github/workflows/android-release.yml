name: Sanggup signed test release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consistency:
    # patuh pre-publish source gate: package, version format, label,
    # permission/license drift, family icon geometry, badge reads the
    # candidate version. A failure stops the release before anything builds.
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@b3c5d671164812ea06fb44857b0f0a423ade0d66
    with:
      app: sanggup
      published: false

  release:
    needs: consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_CERT: C22B004F08852CDB330BCF3A5D899FA0E1CD14FA2D3D5E1A44D15DC7EFBB7C23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build release
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.SANGGUP_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SANGGUP_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sanggup.jks"
          trap 'rm -f "$RUNNER_TEMP/sanggup.jks"' EXIT
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/sanggup.jks" --ks-key-alias sanggup --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out sanggup-v0.2.1.apk /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs sanggup-v0.2.1.apk | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          test "$GOT" = "$EXPECTED_CERT"
          "$BT/aapt" dump badging sanggup-v0.2.1.apk > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -q "package: name='com.vanipy.sanggup' versionCode='7' versionName='0.2.1'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          ! grep -q 'uses-permission:' /tmp/badging.txt
          sha256sum sanggup-v0.2.1.apk > sanggup-v0.2.1.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Signed APK launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r sanggup-v0.2.1.apk
            adb logcat -c
            adb shell am start -W -n com.vanipy.sanggup/.MainActivity
            sleep 20
            mkdir -p release-evidence
            adb exec-out screencap -p > release-evidence/signed-app.png
            adb logcat -d -b crash > release-evidence/crash.txt
            ! grep -q 'Process: com.vanipy.sanggup' release-evidence/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-evidence
          path: release-evidence/
      - name: Upload candidate APK for the byte check
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apk
          path: |
            sanggup-v0.2.1.apk
            sanggup-v0.2.1.apk.sha256
          retention-days: 1

  candidate-bytes:
    # patuh checks the built APK's actual bytes (packaged icon badge) before
    # anything is published. This is the preventive boundary.
    needs: release
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@b3c5d671164812ea06fb44857b0f0a423ade0d66
    with:
      app: sanggup
      published: false
      candidate_apk_artifact: candidate-apk

  publish:
    needs: candidate-bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # notes-file lives in the repo
      - uses: actions/download-artifact@v4
        with: { name: candidate-apk, path: dist }
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 dist/sanggup-v0.2.1.apk dist/sanggup-v0.2.1.apk.sha256 --title 'Sanggup 0.2.1 test' --notes-file android/TEST-RELEASE.md --prerelease --target "$GITHUB_SHA"

  verify:
    # post-publish: verifies the live release (tag, APK name, checksum,
    # gallery card, downloaded sha256, packaged icon). Detects, cannot undo.
    needs: publish
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@b3c5d671164812ea06fb44857b0f0a423ade0d66
    with:
      app: sanggup
      published: true
