  </defs>

  <!-- ground shadow -->
  <ellipse cx="245" cy="384" rx="165" ry="12" fill="#241a33" opacity="0.08"/>

  <!-- tail: long, tapering, curling right into a loose spiral -->
  <path d="M332 264 C 390 246, 442 258, 447 298" fill="none" stroke="#6b3fd4" stroke-width="22" stroke-linecap="round"/>
  <path d="M447 298 C 452 330, 428 348, 406 338" fill="none" stroke="#6b3fd4" stroke-width="15" stroke-linecap="round"/>
  <path d="M406 338 C 392 331, 391 314, 402 309" fill="none" stroke="#6b3fd4" stroke-width="9" stroke-linecap="round"/>
  <circle cx="404" cy="307" r="4.5" fill="#6b3fd4"/>
  <g fill="#ffb84d" opacity="0.9">
    <circle cx="368" cy="256" r="6"/>
    <circle cx="410" cy="262" r="5.5"/>
    <circle cx="440" cy="282" r="5"/>
    <circle cx="446" cy="314" r="4"/>
    <circle cx="424" cy="340" r="3.5"/>
  </g>

  <!-- far-side legs (darker, behind body) -->
  <g stroke="#4a2890" fill="none" stroke-linecap="round">
    <path d="M206 274 L190 306" stroke-width="10"/>
    <path d="M190 306 L196 336" stroke-width="7"/>
    <path d="M196 338 L184 352 M196 338 L196 355 M196 338 L208 353" stroke-width="4.5"/>
    <path d="M290 276 L308 306" stroke-width="11"/>
    <path d="M308 306 L298 336" stroke-width="7"/>
    <path d="M298 338 L284 351 M298 338 L296 356 M298 338 L310 353" stroke-width="4.5"/>
  </g>
  <g fill="#ffb84d">
    <circle cx="184" cy="353" r="4.5"/><circle cx="196" cy="356" r="4.5"/><circle cx="208" cy="354" r="4.5"/>
    <circle cx="284" cy="352" r="4.5"/><circle cx="296" cy="357" r="4.5"/><circle cx="310" cy="354" r="4.5"/>
  </g>

  <!-- body: low, horizontal -->
  <path d="M150 272
           C 180 240, 262 234, 322 254
           C 342 261, 347 270, 340 279
           C 300 301, 218 306, 170 295
           C 150 290, 143 282, 150 272 Z" fill="url(#bodyG)"/>
  <!-- belly -->
  <path d="M168 292 C 214 303, 282 301, 326 282
           C 322 295, 282 307, 232 307
           C 196 307, 170 301, 168 292 Z" fill="#f4eeff"/>

  <!-- neck -->
  <path d="M146 264 Q 130 252 124 236 L 145 222 Q 156 240 160 258 Z" fill="#6b3fd4"/>

  <!-- near-side legs -->
  <g stroke="#5c33a8" fill="none" stroke-linecap="round">
    <path d="M192 280 L168 316" stroke-width="12"/>
    <path d="M168 316 L172 350" stroke-width="8.5"/>
    <path d="M172 352 L152 368 M172 352 L163 375 M172 352 L177 378 M172 352 L190 372" stroke-width="5"/>
    <path d="M302 282 L330 316" stroke-width="13"/>
    <path d="M330 316 L316 350" stroke-width="9"/>
    <path d="M316 352 L296 368 M316 352 L309 376 M316 352 L324 377 M316 352 L338 370" stroke-width="5"/>
  </g>
  <g fill="#ffb84d">
    <circle cx="152" cy="369" r="6"/><circle cx="163" cy="376" r="6"/><circle cx="177" cy="379" r="6"/><circle cx="190" cy="373" r="6"/>
    <circle cx="296" cy="369" r="6"/><circle cx="309" cy="377" r="6"/><circle cx="324" cy="378" r="6"/><circle cx="338" cy="371" r="6"/>
  </g>

  <!-- head: wedge, distinct from body -->
  <path d="M78 208
           Q 72 220 82 231
           Q 100 246 126 241
           Q 147 237 151 222
           Q 153 206 138 197
           Q 112 186 91 195
           Q 79 200 78 208 Z" fill="url(#bodyG)"/>

  <!-- far eye peeking over the head ridge -->
  <ellipse cx="140" cy="197" rx="8" ry="9" fill="#ffffff"/>
  <circle cx="141" cy="198" r="5.5" fill="#ffb84d"/>
  <ellipse cx="141" cy="198" rx="1.6" ry="4" fill="#241a33"/>

  <!-- near eye -->
  <ellipse cx="111" cy="210" rx="16" ry="17" fill="#ffffff"/>
  <circle cx="112" cy="211" r="12" fill="#ffb84d"/>
  <ellipse cx="112" cy="211" rx="3" ry="9" fill="#241a33"/>
  <circle cx="107" cy="204" r="3.5" fill="#ffffff"/>

  <!-- long gecko grin -->
  <path d="M84 224 Q 100 237 122 235 Q 138 232 146 224" fill="none" stroke="#3d2a5e" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="85" cy="215" r="2.4" fill="#3d2a5e"/>

  <!-- eyelash crests above near eye -->
  <g fill="#5c33a8">
    <path d="M98 196 l7 -11 l6 11 z"/>
    <path d="M110 191 l7 -11 l6 11 z"/>
    <path d="M122 190 l7 -11 l6 11 z"/>
  </g>
  <!-- dorsal crest row along neck and back -->
  <g fill="#5c33a8">
    <circle cx="152" cy="238" r="4"/>
    <circle cx="172" cy="240" r="4"/>
    <circle cx="196" cy="238" r="4"/>
    <circle cx="222" cy="236" r="4"/>
    <circle cx="248" cy="235" r="4"/>
    <circle cx="274" cy="236" r="4"/>
    <circle cx="300" cy="240" r="4"/>
    <circle cx="322" cy="247" r="4"/>
  </g>
  <!-- leopard-gecko spots -->
  <g fill="#8a5fd0">
    <circle cx="200" cy="258" r="6"/>
    <circle cx="242" cy="250" r="5"/>
    <circle cx="282" cy="258" r="6"/>
    <circle cx="220" cy="272" r="4"/>
    <circle cx="262" cy="272" r="4"/>
    <circle cx="312" cy="266" r="4.5"/>
  </g>
</svg>
</svg>
