<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<rect width="64" height="64" rx="14" fill="#f5c96b"/>
<svg x="3" y="6" width="58" height="52" viewBox="72 172 120 108">
  <defs>
    <radialGradient id="bodyG" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8a63e8"/>
      <stop offset="100%" stop-color="#6b3fd4"/>
